name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      # actions/checkout needs git and HTTPS certs already in the container:
      # without git, a checkout with submodules: true FAILS outright (it
      # cannot fall back to the REST API download for submodules) (ADR-0013).
      # ci/install-toolchain.sh runs later, after checkout, and installs the
      # rest of the toolchain (it re-installs these two harmlessly).
      - name: Install git for checkout
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      # The container runs as root, and git (>= 2.35.2) refuses to operate
      # on a repository it doesn't own unless told to trust it. Without
      # this, `git ls-files` inside `make check-pins` fails.
      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vendor/cmark-gfm"

      - name: Install toolchain
        run: sh ci/install-toolchain.sh

      - name: make info
        run: make info

      - name: make check-help
        run: make check-help

      - name: guix-env-launcher (dry run; needs no Guix)
        run: sh tests/guix-env-launcher.sh

      - name: make check-vocabulary
        run: make check-vocabulary

      - name: make check-pins
        run: make check-pins

      - name: make check-notice
        run: make check-notice

      # A job skips its later steps once one fails. The Lisp steps run anyway,
      # so a failed check above doesn't hide their results; -k runs
      # check-fixtures even when check-purity fails (ADR-0013).
      - name: make deps
        if: ${{ !cancelled() }}
        run: make deps

      - name: make test
        if: ${{ !cancelled() }}
        run: make -k test

      # CCL's and ECL's native suites are slow, so they run only on a push
      # to main or a dispatch (M4 design D3; ADR-0013): NATIVE_LISPS keeps
      # its sbcl default, so make test above already covers what a pull
      # request runs.
      - name: make check-native (CCL and ECL)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: make check-native NATIVE_LISPS="ccl ecl"

      # This step comes after the native suites above, so that discovery
      # only ever sees the runtime packages, as a user's install would
      # (ADR-0009; ADR-0013). The -dev packages ship the static archives
      # make check-ecl-static links (M4 design §6.5).
      # No apt-get update: the job's first step already ran it in this
      # same container, and these packages are in the apt index it
      # already fetched.
      - name: Install cmark-gfm's archives
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends \
            libcmark-gfm-dev libcmark-gfm-extensions-dev

      # Builds an ECL program with cmark-gfm linked in and runs the smoke
      # program (M4 design §6.3); on main and on dispatch only, like the
      # step above.
      - name: make check-ecl-static
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: make check-ecl-static

      # No dependency cache yet: ./ocicl/ could be cached, keyed on a hash
      # of ocicl.csv, alongside the checkout step above (left for later).
